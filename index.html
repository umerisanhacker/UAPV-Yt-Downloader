<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UAPV YouTube Downloader</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #090d16;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #ff7b00, #ff4500);
            top: -100px;
            left: -100px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.5;
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #001f3f, #004080);
            bottom: -150px;
            right: -150px;
            border-radius: 50%;
            filter: blur(140px);
            opacity: 0.8;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            background: rgba(16, 23, 42, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 123, 0, 0.2);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(255, 123, 0, 0.1);
            width: 100%;
            max-width: 600px;
            text-align: center;
            color: #ffffff;
        }

        h2 {
            margin-bottom: 25px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #ffa500;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 16px;
            font-size: 16px;
            background: #0b1120;
            border: 2px solid #1e293b;
            color: #fff;
            border-radius: 8px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #ff7b00;
            outline: none;
            box-shadow: 0 0 10px rgba(255, 123, 0, 0.3);
        }

        button {
            padding: 12px 24px;
            font-size: 16px;
            font-weight: 600;
            background: linear-gradient(135deg, #ff7b00, #ff4500);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 123, 0, 0.4);
        }

        .action-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-reset {
            background: linear-gradient(135deg, #334155, #1e293b);
            border: 1px solid #475569;
        }

        .btn-reset:hover {
            box-shadow: 0 5px 15px rgba(71, 85, 105, 0.4);
        }

        .result {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #1e293b;
            padding-top: 20px;
        }

        .result img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .result h3 {
            font-size: 18px;
            margin: 10px 0;
            color: #f8fafc;
        }

        .result p {
            color: #94a3b8;
            font-size: 14px;
        }

        label {
            display: block;
            margin: 15px 0 8px;
            font-weight: 500;
            color: #cbd5e1;
        }

        select {
            width: 100%;
            padding: 12px;
            background: #0b1120;
            color: #fff;
            border: 2px solid #1e293b;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            margin-bottom: 20px;
        }

        select:focus {
            border-color: #ff7b00;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-audio {
            background: linear-gradient(135deg, #0284c7, #0369a1);
        }

        .btn-audio:hover {
            box-shadow: 0 5px 15px rgba(2, 132, 199, 0.4);
        }

        .progress-container {
            margin-top: 20px;
            text-align: left;
        }

        .progress-bar-bg {
            width: 100%;
            background-color: #0b1120;
            border: 2px solid #1e293b;
            border-radius: 8px;
            overflow: hidden;
            height: 24px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #10b981, #22c55e);
            transition: width 0.3s ease;
        }

        .progress-text {
            margin-top: 8px;
            font-size: 14px;
            color: #22c55e;
            font-weight: 500;
            text-align: center;
        }

        .loading {
            margin-top: 15px;
            color: #ffa500;
            font-weight: 500;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>UAPV YouTube Downloader</h2>
    <input type="text" id="urlInput" placeholder="Paste YouTube Link Here...">
    
    <div class="action-group">
        <button onclick="fetchVideoInfo()">Fetch Video</button>
        <button class="btn-reset" onclick="resetApp()">Reset</button>
    </div>

    <div id="loading" class="loading hidden">Processing video streams & formats... Please wait.</div>

    <div id="resultContainer" class="result hidden">
        <img id="thumbnail" src="" alt="Thumbnail">
        <h3 id="videoTitle"></h3>
        <p id="videoDuration"></p>
        
        <label for="formatSelect">Select Video Quality, FPS & Codec:</label>
        <select id="formatSelect"></select>
        
        <div class="btn-group">
            <button onclick="startDownload('video')">Download Video (MP4)</button>
            <button class="btn-audio" onclick="startDownload('audio')">Download Audio (MP3)</button>
        </div>

        <div id="progressContainer" class="progress-container hidden">
            <div class="progress-bar-bg">
                <div id="progressBar" class="progress-bar-fill"></div>
            </div>
            <p id="progressText" class="progress-text">Initializing download... 0%</p>
        </div>
    </div>
</div>

<script>
    let currentUrl = "";

    async function fetchVideoInfo() {
        currentUrl = document.getElementById('urlInput').value;
        if (!currentUrl) return alert("Please enter a URL");

        document.getElementById('loading').classList.remove('hidden');
        document.getElementById('resultContainer').classList.add('hidden');

        try {
            let response = await fetch('/get-info', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentUrl })
            });

            let data = await response.json();
            document.getElementById('loading').classList.add('hidden');

            if (data.error) {
                alert("Error: " + data.error);
                return;
            }

            document.getElementById('thumbnail').src = data.thumbnail;
            document.getElementById('videoTitle').innerText = data.title;
            document.getElementById('videoDuration').innerText = "Duration: " + data.duration;

            let select = document.getElementById('formatSelect');
            select.innerHTML = '';
            data.formats.forEach(f => {
                let option = document.createElement('option');
                option.value = f.format_id;
                option.text = f.label;
                select.appendChild(option);
            });

            document.getElementById('resultContainer').classList.remove('hidden');
        } catch (err) {
            document.getElementById('loading').classList.add('hidden');
            alert("Failed to connect to server.");
        }
    }

    async function startDownload(type) {
        let formatId = document.getElementById('formatSelect').value;
        if (!currentUrl) return alert("Please fetch a video first.");

        let progressContainer = document.getElementById('progressContainer');
        let progressBar = document.getElementById('progressBar');
        let progressText = document.getElementById('progressText');
        
        progressContainer.classList.remove('hidden');
        progressBar.style.width = '0%';
        progressText.innerText = 'Connecting streams... 0%';

        try {
            let resp = await fetch('/start-download', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: currentUrl, format_id: formatId, type: type })
            });

            let data = await resp.json();
            if (data.error) {
                alert("Error: " + data.error);
                progressContainer.classList.add('hidden');
                return;
            }

            let taskId = data.task_id;
            let pollInterval = setInterval(async () => {
                let pResp = await fetch(`/progress/${taskId}`);
                let pData = await pResp.json();

                if (pData.status === 'downloading') {
                    let pct = pData.progress.toFixed(1);
                    progressBar.style.width = pct + '%';
                    progressText.innerText = `Downloading stream... ${pct}%`;
                } else if (pData.status === 'processing') {
                    progressBar.style.width = '100%';
                    progressText.innerText = `Merging video and audio streams via FFmpeg...`;
                } else if (pData.status === 'completed') {
                    clearInterval(pollInterval);
                    progressBar.style.width = '100%';
                    progressText.innerText = `Download Complete! Saving file...`;
                    
                    setTimeout(() => {
                        window.location.href = `/get-file/${taskId}`;
                        progressContainer.classList.add('hidden');
                    }, 1200);
                } else if (pData.status === 'error') {
                    clearInterval(pollInterval);
                    alert("Download failed: " + pData.error);
                    progressContainer.classList.add('hidden');
                }
            }, 500);

        } catch (err) {
            alert("Failed to process download request.");
            progressContainer.classList.add('hidden');
        }
    }

    function resetApp() {
        currentUrl = "";
        document.getElementById('urlInput').value = "";
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('resultContainer').classList.add('hidden');
        document.getElementById('progressContainer').classList.add('hidden');
        document.getElementById('thumbnail').src = "";
        document.getElementById('videoTitle').innerText = "";
        document.getElementById('videoDuration').innerText = "";
        document.getElementById('formatSelect').innerHTML = "";
    }
</script>

</body>
</html>
